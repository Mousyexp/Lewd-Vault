<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lewd Vault: One key</title>
<meta name="viewport" content="width=1920, height=1080">
<link rel="stylesheet" href="./runtime/fonts.css">
<style>
/* ACCENT = "yours": the app's own pink, on the one word that is the user's. The screensaver's cold blue means "nothing to see". */
@font-face { font-family: 'Nunito'; src: url(fonts/nunito-latin.woff2) format('woff2'); font-weight: 200 1000; }
@font-face { font-family: 'Dancing Script'; src: url(fonts/dancing-latin.woff2) format('woff2'); font-weight: 400 700; }
:root {
  --ground: #241c20;      /* the app's own sidebar */
  --ink: #fbeef1;
  --accent: #E27589;      /* the app's accent */
  --font: "Nunito", "Inter", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
#main { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); color: var(--ink); font-family: var(--font); font-weight: 600; }
.scene { position: absolute; inset: 0; overflow: hidden; }
.cam { position: absolute; left: 0; top: 0; width: 1400px; height: 900px; }
.cam img { position: absolute; left: 0; top: 0; width: 1400px; height: 900px; display: block; }
/* the words: centred, paced to reading, over the moving picture */
.line { position: absolute; left: 0; width: 1920px; text-align: center; white-space: pre; font-size: 92px; line-height: 116px; font-weight: 800; letter-spacing: -.01em;
        text-shadow: 0 4px 30px rgba(20, 6, 12, .75), 0 2px 6px rgba(20, 6, 12, .6); }
/* the dim of the room while someone is coming: light, not a card */
.dim { position: absolute; inset: 0; background: radial-gradient(ellipse 70% 60% at 50% 48%, rgba(20, 8, 14, .15), rgba(20, 8, 14, .7)); }
/* the real keys (the app's kbd style, made physical): Ctrl + Shift + Space */
.keys { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
.key { position: absolute; top: 790px; height: 132px; border-radius: 22px; display: flex; align-items: center; justify-content: center;
       font: 700 46px/1 var(--font); color: #3b2a31;
       background: linear-gradient(180deg, #fff7f9 0%, #f6e3e8 60%, #ecd2d9 100%);
       box-shadow: 0 14px 0 #c79aa6, 0 26px 50px rgba(10, 2, 6, .55), inset 0 2px 0 #ffffff; }
.key b { font-weight: 800; }
#kCtrl { left: 452px; width: 210px; } #kShift { left: 692px; width: 250px; } #kSpace { left: 972px; width: 500px; }
/* the app's own screensaver (ui/desktop.css .pv-screen), rebuilt so its light can drift */
#s5 { background: #0b1020; }
.au { position: absolute; width: 1344px; height: 1344px; border-radius: 50%; filter: blur(150px); opacity: .55; }
#au1 { background: #2b6fd6; left: -384px; top: -480px; }
#au2 { background: #1aa39a; left: 1056px; top: 192px; }
#au3 { background: #6b4fd8; left: 192px; top: 400px; }
.clock { position: absolute; left: 115px; bottom: 97px; color: #fff; font-family: "Inter", "Segoe UI", system-ui, sans-serif; text-shadow: 0 2px 18px rgba(0, 0, 0, .35); }
.clock b { display: block; font-size: 211px; font-weight: 300; line-height: 1; letter-spacing: -.02em; }
.clock span { display: block; font-size: 42px; font-weight: 400; opacity: .9; margin-top: 6px; }
#tagline { top: 690px; font-size: 64px; line-height: 80px; font-weight: 700; }
</style>
</head>
<body>
<div id="main">

  <!-- BEAT 1 HOOK (0-62): the Library, magnified, gliding across the five pictures -->
  <section id="s1" class="scene"><div id="cam1" class="cam"><img src="plates/library.jpg" alt=""></div></section>

  <!-- BEAT 2 PROOF (62-110): tagging the bear picture: category, tags -->
  <section id="s2" class="scene" style="visibility:hidden"><div id="cam2" class="cam"><img src="plates/add.jpg" alt=""></div></section>

  <!-- BEAT 3-4 PROOF + TURN (110-200): the slideshow; "Someone at the door?"; the keys -->
  <section id="s3" class="scene" style="visibility:hidden;background:#000">
    <div id="cam3" class="cam"><img src="plates/slideshow.jpg" alt=""></div>
    <div id="dim3" class="dim"></div>
    <div id="ask" class="line" style="top:330px">Someone at the door?</div>
  </section>

  <!-- BEAT 5 THE POINT (200-268): the screensaver -->
  <section id="s5" class="scene" style="visibility:hidden">
    <div id="cam5" style="position:absolute;left:0;top:0;width:1920px;height:1080px">
    <div id="au1" class="au"></div><div id="au2" class="au"></div><div id="au3" class="au"></div>
    <div class="clock"><b>10:10</b><span>Friday, November 6</span></div>
    </div>
  </section>

  <!-- BEAT 6 PROOF (268-340): back, then Untraceable -->
  <section id="s6" class="scene" style="visibility:hidden"><div id="cam6" class="cam"><img src="plates/library.jpg" alt=""></div></section>
  <section id="s6b" class="scene" style="visibility:hidden"><div id="cam6b" class="cam"><img src="plates/untraceable.jpg" alt=""></div></section>

  <!-- BEAT 7 CTA (340-405): into the app's own heart + wordmark -->
  <section id="s7" class="scene" style="visibility:hidden"><div id="cam7" class="cam"><img src="plates/library.jpg" alt=""></div></section>
  <section id="s7b" class="scene" style="visibility:hidden">
    <div id="cam7b" class="cam"><img src="plates/lockup.png" alt="" style="width:235px;height:63px"></div>
    <div id="tagline" class="line">100% private, and all yours.</div>
  </section>

  <!-- the keys, above every scene they cross -->
  <div id="keys" class="keys">
    <div id="kCtrl" class="key"><b>Ctrl</b></div>
    <div id="kShift" class="key"><b>Shift</b></div>
    <div id="kSpace" class="key"><b>Space</b></div>
  </div>
</div>

<script src="./runtime/vendor/gsap.min.js"></script>
<script src="./runtime/motion.js"></script>
<script>
const M = Motion.film({ fps: 30, duration: 13.5, width: 1920, height: 1080, clock: 'smooth' });
const ACCENT = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
// a screenshot point (cx, cy) at the frame centre, at scale s (1 screenshot px = s film px); camera origin is the top-left
const at = (cx, cy, s, ox = 960, oy = 540) => ({ x: ox - cx * s, y: oy - cy * s, scale: s });
const cam = (el, keys, ease) => M.camera(el, keys.map(([f, v, e]) => (e ? [f, v, e] : [f, v])), { origin: '0% 0%', ease: ease || 'cruise' });

/* BEAT 1  HOOK: already moving on frame 0, gliding left across the pictures */
cam('#cam1', [[0, at(980, 470, 1.62)], [62, at(560, 520, 1.74)]], 'softInOut');

/* BEAT 2  PROOF: tagging (the chips at ~0.04 H), pushing in */
M.cut(62, { hide: ['#s1'], show: ['#s2'] });
cam('#cam2', [[62, at(1060, 420, 2.8)], [110, at(1130, 430, 3.25)]], 'glide');

/* BEAT 3  PROOF: the slideshow, a slow push that carries through the turn */
M.cut(110, { hide: ['#s2'], show: ['#s3'] });
cam('#cam3', [[110, at(700, 470, 1.66)], [200, at(690, 420, 1.92)]], 'cruise');

/* BEAT 4  TURN: the room dims, the question, the keys crash in and go down together */
M.kf('#dim3', 'opacity', [[110, 0], [150, 0], [168, 1, 'softInOut']]);
M.words('#ask', { at: 152, mech: 'rise', dist: 70, gaps: [5, 4, 6], frames: 13, ease: 'softLand', smear: true, fixedSlots: false });
M.hide('#ask', 200);
const keys = ['#kCtrl', '#kShift', '#kSpace'];
M.cascade(keys, { at: 176, gaps: [3, 3], fn: (el, f) => M.enter(el, { at: f, frames: 10, ease: 'softLand', from: { scale: 3.2, y: 160, blur: 10 }, smear: { axis: 'y', px: 26, frames: 3 } }) });
// each key: enter on the key itself, the presses on one wrapper (y), the return's scale on another (about the keys' middle)
const press = { '#kCtrl': [193, 260], '#kShift': [195, 261], '#kSpace': [197, 263] };
const back = { '#kCtrl': 244, '#kShift': 246, '#kSpace': 248 };
keys.forEach(k => {
  const wA = M.wrap(k), wB = M.wrap(wA);
  wB.style.transformOrigin = '962px 856px';
  const [p1, p2] = press[k];
  // the chord: each key bottoms out in 2 f, the screen answers a frame after Space
  M.kf(wA, 'y', [[0, 0], [p1, 0], [p1 + 2, 12, 'whip'], [243, 12], [243, 0], [p2, 0], [p2 + 2, 12, 'whip']]);
  M.kf(wB, 'scale', [[0, 1], [243, 1], [243, 1.6], [back[k], 1.6], [back[k] + 8, .82, 'softLand']]);
  M.kf(wB, 'x', [[0, 0], [243, 0], [243, 330]]);   // (the second time, clear of the screensaver's date)
});
M.cut(199, { hide: ['#s3', '#keys'], show: ['#s5'] });
M.mark(199, 'press', 'emergency key: hidden');

/* BEAT 5  THE POINT: the app's screensaver; only the light drifts (a 2 s breath: the joke lands in the stillness) */
M.kf('#au1', 'x', [[199, 0], [270, 120]]); M.kf('#au1', 'y', [[199, 0], [270, 60]]);
M.kf('#au2', 'x', [[199, 0], [270, -90]]); M.kf('#au2', 'y', [[199, 0], [270, 70]]);
M.kf('#au3', 'x', [[199, 0], [270, 80]]); M.kf('#au3', 'scale', [[199, 1], [270, 1.1]]);
// filmed like a screen in the room: the camera is already close on the clock and keeps creeping in
M.camera('#cam5', [[199, { x: -40, y: -330, scale: 1.25 }], [270, { x: -70, y: -400, scale: 1.31 }]], { origin: '0% 0%', ease: 'cruise' });
// the keys come back, smaller this time, and go down again (scale and presses above)
M.show('#keys', 244);
M.cut(265, { hide: ['#s5', '#keys'], show: ['#s6'] });
M.mark(265, 'press', 'back');

/* BEAT 6  PROOF: everything is back, wide; then the Untraceable page */
M.snap('#cam6', { at: 265, from: at(700, 450, 1.62), to: at(700, 450, 1.3714), tail: 14, origin: '0% 0%' });
M.cut(296, { hide: ['#s6'], show: ['#s6b'] });
cam('#cam6b', [[296, at(560, 330, 2.35)], [340, at(600, 300, 2.7)]], 'glide');

/* BEAT 7  CTA: into the sidebar's heart + wordmark; the vault closes around it; the line lands; ends drifting */
M.cut(340, { hide: ['#s6b'], show: ['#s7'] });
const end = [[340, at(300, 160, 1.9, 960, 470)], [372, at(97, 33, 4.6, 960, 470), 'softLand'], [405, at(97, 33, 4.35, 960, 470)]];
cam('#cam7', end);
cam('#cam7b', end);
M.cut(366, { hide: ['#s7'], show: ['#s7b'] });
M.words('#tagline', { at: 370, mech: 'rise', dist: 50, gaps: [4, 4, 4, 6], frames: 12, ease: 'softLand', fixedSlots: false, accent: { color: ACCENT, frames: 90, word: -1 } });

window.__ready = Motion.loaded().then(() => { if (/selftest/.test(location.search)) Motion.selfTest(M, { samples: 24 }); });
</script>
</body>
</html>
