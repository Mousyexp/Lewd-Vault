# Sets a release's notes to .github/release-notes.md (Actions -> Release notes -> Run workflow).
name: Release notes

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'The release (its tag, e.g. V1.1)'
        type: string
        required: true

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: gh release edit "$TAG" --notes-file .github/release-notes.md --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
