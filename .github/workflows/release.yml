# Checks every push, and builds the Windows app for every version tag (v0.2.0, v0.3.0 …), attaching
# it to a GitHub Release as Lewd-Vault.exe. The app's "Check for updates" reads that release.
#
# To release: bump the version in package.json, src-tauri/Cargo.toml and src-tauri/tauri.conf.json,
# then push a tag:  git tag v0.2.0  &&  git push origin v0.2.0
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      - name: Name the app
        shell: pwsh
        run: Copy-Item src-tauri/target/release/image-vault.exe Lewd-Vault.exe
      - uses: softprops/action-gh-release@v2
        with:
          files: Lewd-Vault.exe
          generate_release_notes: true
