[package]
name = "image-vault"
version = "1.1.0"
description = "Image Vault, as a portable desktop app over a local folder"
edition = "2021"

# The app is a library so the same code builds for iOS too (where the platform owns the entry point
# and links the staticlib); main.rs is the desktop entry point.
[lib]
name = "image_vault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = "0.4"
md5 = "0.7"
percent-encoding = "2"
trash = "5"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
rust_xlsxwriter = "0.100"
zip = { version = "2", default-features = false, features = ["deflate"] } # (deflate: to read the portable zip an update comes in)
ureq = "2"
sha2 = "0.10" # (Google sign-in, gdrive.rs: the PKCE challenge)
getrandom = "0.2"
chacha20 = "0.9" # (Untraceable mode, crypt.rs: the files encrypted)
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
image = { version = "0.25", default-features = false, features = ["webp", "jpeg", "png", "gif"] }
tauri-plugin-opener = "2.7.3"

[profile.release]
# smaller exe; the backend does little work, so speed isn't the point here
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
