[package]
name = "image-vault"
version = "0.2.0"
description = "Image Vault, as a portable desktop app over a local folder"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = "0.4"
md5 = "0.7"
percent-encoding = "2"
trash = "5"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
rust_xlsxwriter = "0.100"
zip = { version = "2", default-features = false }
ureq = "2"
image = { version = "0.25", default-features = false, features = ["webp", "jpeg", "png", "gif"] }

[profile.release]
# smaller exe; the backend does little work, so speed isn't the point here
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
