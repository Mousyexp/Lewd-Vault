# Builds the iOS app on a macOS runner and attaches an IPA.
#
# The iOS build cannot run on Windows or Linux: it needs Xcode, XcodeGen and CocoaPods. The artifact
# is unsigned by default (`--no-sign`), then signed on the device by whatever sideloading tool you
# use (AltStore/SideStore, TrollStore, or your own certificate) — see mobile/README.md.
#
# Trigger it by hand (Actions -> Build iOS -> Run workflow) or on a pull request that touches the
# app. Set the Apple API key secrets (below) to produce a *signed* IPA instead.
name: Build iOS

on:
  workflow_dispatch:
    inputs:
      signed:
        description: 'Build a signed IPA (needs the four Apple secrets). Leave off for the first run.'
        type: boolean
        default: false
      release:
        description: 'Also attach the IPA to this release (its tag, e.g. v1.2.0), replacing an IPA already there'
        type: string
        default: ''
  push:
    branches: [main]
    # (only when something the app is built from changed: a macOS build for a README edit is a waste)
    paths:
      - 'src-tauri/**'
      - 'ui/**'
      - 'mobile/**'
      - 'tools/**'
      - 'sync-ui.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'art/app-icon.png'
      - 'art/icons/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'ui/**'
      - 'mobile/**'
      - 'tools/**'
      - 'sync-ui.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'art/app-icon.png'
      - 'art/icons/**'
      - '.github/workflows/ios.yml'

# The workflow only reads the repo (nothing is pushed), so the default token needs no write scopes.
permissions:
  contents: read

concurrency:
  # a new build for the same ref replaces one still running
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    # The acceptance gate for "a vault round-trips between Windows and iOS" is the Rust test suite:
    # index/views CSV byte-identity, the golden vault (read, then no-op rewrite, must be identical),
    # the untraceable fixture made elsewhere, uid allocation, the file-name format. It lives in the
    # crate, so `npm test` alone (all the Windows release workflow runs) does not cover it.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # The crate is a Tauri app, so even `cargo test` compiles the desktop backend, which needs the
      # Linux GTK/WebKit headers. Without them the build dies in a `-sys` build script
      # ("Package gobject-2.0 was not found in the pkg-config search path").
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            librsvg2-dev libxdo-dev libssl-dev pkg-config build-essential
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # `cargo test` compiles the crate with tauri::generate_context!, which requires the
      # frontendDist directory (../src) to exist — it is gitignored and written by sync-ui.
      - run: npm run sync
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  ipa:
    # macos-26 is macOS 26 Tahoe. Its default Xcode is 26.6 (iOS 26 SDK), required because
    # bundle.iOS.minimumSystemVersion is 26.0 (an older SDK cannot target 26). The default Xcode drifts
    # when GitHub updates the image, so the version is pinned in a step below.
    runs-on: macos-26
    needs: rust-tests
    # A cold run compiles the whole Rust tree for aarch64-apple-ios plus the CocoaPods graph. Give it
    # room so a slow first build does not hit the limit (later runs reuse the caches below).
    timeout-minutes: 90
    # (write, only to attach the IPA to a release when the run asks for it; see the last step)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Without this the iOS compile fails with "can't find crate for `std`" (target not installed).
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          # Caches ~/.cargo and src-tauri/target (including the aarch64-apple-ios triple), so a
          # re-run does not recompile every dependency.
          workspaces: src-tauri
      # Pin the SDK. `macos-26` defaults to Xcode 26.6 today; if GitHub moves the default this keeps
      # the iOS 26 SDK (and prints what was actually used, so a drift is visible in the log).
      - name: Select Xcode 26.6
        run: |
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          fi
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true
      - run: npm ci
      # npm test runs sync-ui.mjs (which writes the gitignored src/ the build needs) and checks the
      # page hangs together.
      - run: npm test
      # Explicit, so the build below does not depend on a side effect of the test: writes src/.
      - run: npm run sync
      # XcodeGen turns project.yml into the Xcode project; CocoaPods resolves the Tauri pods.
      # (CocoaPods is preinstalled on the runner; XcodeGen is not.) Auto-update is off so a headless
      # runner never waits on a Homebrew prompt.
      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: brew install xcodegen
      # Creates src-tauri/gen/apple (the Xcode project) once; a no-op when it is already there.
      - run: npx tauri ios init --ci
      # The real icon into the asset catalog. It has to run *after* ios init, because `tauri icon`
      # writes into gen/apple/Assets.xcassets/AppIcon.appiconset when that exists (and falls back to
      # src-tauri/icons/ios otherwise), so running it first would leave the template's placeholder
      # icons in the build.
      - run: npx tauri icon art/app-icon.png
      # The app icon presets as alternate icons, and the share extension (tools/ios-patch.mjs).
      - run: node tools/ios-patch.mjs
      # Headless keychain: unlock it and grant codesign access so nothing waits on a password prompt
      # a cloud runner cannot answer. Each line is best-effort (`|| true`): with --no-sign none of this
      # is needed, and with the Apple secrets below the CLI signs from a temporary keychain.
      - name: Prepare the keychain (headless)
        run: |
          security default-keychain -s "$HOME/Library/Keychains/login.keychain-db" || true
          security unlock-keychain -p "" "$HOME/Library/Keychains/login.keychain-db" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$HOME/Library/Keychains/login.keychain-db" || true
      - name: Build the IPA
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          # Manual runs pick the path; pushes and PRs always take the unsigned path (the secrets are
          # not needed for sideloading, and an unsigned build is the honest way to test the toolchain).
          SIGNED: ${{ github.event_name == 'workflow_dispatch' && inputs.signed || 'false' }}
        run: |
          # A signed IPA when the run asked for it *and* all four Apple secrets are set, otherwise an
          # unsigned one. All four are required: the API key authorizes the export, and the team ID is
          # what Xcode signs with (without it the export fails, because the project has no
          # DEVELOPMENT_TEAM otherwise). `tauri ios build` wants APPLE_API_KEY_PATH to point at a file,
          # so the .p8 is kept in a secret as text and written here. With --no-sign none of it is
          # needed, which is the sideloading path: AltStore/SideStore sign on the device.
          if [ "$SIGNED" = "true" ] && [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_DEVELOPMENT_TEAM" ]; then
            umask 077
            key="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$key"
            export APPLE_API_KEY_PATH="$key"
            npx tauri ios build --export-method debugging
          else
            # The Apple secrets are not set in this repo, so GitHub passes them as *empty* strings.
            # Tauri's credential reader treats "present but empty" as a mistake and aborts (it only
            # tolerates all three being absent), so clear them for the unsigned path. Nothing is
            # signed here — sideloading tools sign on the device.
            unset APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_PATH
            # `tauri ios build` assembles the Apple config *before* it looks at `--no-sign`, and that
            # config rejects an empty development team (`apple.development-team` is empty). A
            # placeholder satisfies the check; a real team from the secret still wins when the signed
            # path is taken.
            export APPLE_DEVELOPMENT_TEAM="${APPLE_DEVELOPMENT_TEAM:-0000000000}"
            npx tauri ios build --no-sign
          fi
      # Unsigned builds carry no entitlements, so a sideloading tool wouldn't give the app and its share
      # extension their shared folder (the app group). An ad-hoc signature with the entitlements fixes
      # that; AltStore/SideStore re-sign with your account and keep them.
      - name: Give the IPA its entitlements (ad-hoc)
        if: env.SIGNED != 'true'
        env:
          SIGNED: ${{ github.event_name == 'workflow_dispatch' && inputs.signed || 'false' }}
        run: |
          ipa=$(find src-tauri/gen/apple -name '*.ipa' | head -1)
          test -n "$ipa"
          ipa="$GITHUB_WORKSPACE/$ipa"
          work="$RUNNER_TEMP/ipa"; rm -rf "$work"; mkdir -p "$work"; cd "$work"
          unzip -q "$ipa"
          app=$(ls -d Payload/*.app | head -1)
          ls "$app/PlugIns" || echo "no PlugIns folder"
          if [ -d "$app/PlugIns/ShareExtension.appex" ]; then
            codesign -f -s - --entitlements "$GITHUB_WORKSPACE/mobile/ios/share.entitlements" "$app/PlugIns/ShareExtension.appex"
          fi
          codesign -f -s - --entitlements "$GITHUB_WORKSPACE/mobile/ios/app.entitlements" "$app"
          codesign -d --entitlements - "$app" || true
          rm "$ipa"; zip -qry "$ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: LewdVault-ipa
          # `tauri ios build` writes the IPA to gen/apple/build/<arch>/ (the product name has a space,
          # which the glob matches). Broadened so a layout change does not silently fail the upload.
          path: |
            src-tauri/gen/apple/**/*.ipa
          if-no-files-found: error
      # Run workflow with "release" set: the IPA goes onto that release as Lewd.Vault.iOS.ipa, replacing
      # the one there (--clobber), next to the Windows downloads.
      - name: Attach the IPA to the release
        if: github.event_name == 'workflow_dispatch' && inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
        run: |
          ipa=$(find src-tauri/gen/apple -name '*.ipa' | head -1)
          cp "$ipa" Lewd.Vault.iOS.ipa
          gh release upload "$TAG" Lewd.Vault.iOS.ipa --clobber --repo "$GITHUB_REPOSITORY"
